<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CHRONICLES OF THE SLIDE TRAGEDY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Courier New',monospace;background:#000;color:#FFF;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:fixed;width:100%}
#game{width:100%;max-width:500px;height:100vh;display:flex;flex-direction:column;position:relative;background:#111;padding:8px;gap:8px}
#battle-box{width:100%;flex:1;max-height:50vh;border:4px solid #FFF;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none}
#heart{position:absolute;width:24px;height:24px;background:#F00;clip-path:polygon(50% 0%,100% 30%,80% 100%,50% 70%,20% 100%,0% 30%);z-index:10;pointer-events:none}
.bullet{position:absolute;background:#FFF;border-radius:50%;pointer-events:none}
.soul-text{position:absolute;top:10px;left:10px;font-size:14px;pointer-events:none}
#dialogue-box{width:100%;min-height:120px;background:#FFF;color:#000;padding:12px;font-size:16px;position:relative;overflow:hidden;flex-shrink:0}
#dialogue-text{white-space:pre-wrap;line-height:1.4}
#choices{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.choice-btn{background:#000;color:#FFF;padding:12px 16px;border:3px solid #FFF;font-size:16px;cursor:pointer;font-family:inherit;width:100%;text-align:left;touch-action:manipulation;transition:all 0.1s}
.choice-btn:active{transform:scale(0.98)}
.choice-btn.selected{background:#FF0;color:#000;border-color:#000}
#stats{position:absolute;top:8px;right:8px;display:flex;gap:15px;font-size:16px;background:rgba(0,0,0,0.7);padding:8px 12px;border:2px solid #FFF;z-index:5;pointer-events:none}
#enemy{font-size:80px;pointer-events:none;animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0}}
.flash{animation:flash .3s}
#touch-indicator{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,0,0.6);border-radius:50%;pointer-events:none;display:none;z-index:20}
</style>
</head>
<body>
<div id="game">
  <div id="stats">
    <span>LV <span id="lv">1</span></span>
    <span>HP <span id="hp">20</span>/<span id="max-hp">20</span></span>
  </div>
  <div id="battle-box">
    <div id="heart"></div>
    <div id="enemy"></div>
    <div class="soul-text">* You feel reality trembling.</div>
    <div id="touch-indicator"></div>
  </div>
  <div id="dialogue-box">
    <div id="dialogue-text">* Welcome to CHRONICLES OF THE SLIDE TRAGEDY.</div>
    <div id="choices"></div>
  </div>
</div>

<script>
// Telegram WebApp initialization
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  Telegram.WebApp.enableClosingConfirmation();
}

const heart = document.getElementById('heart');
const battleBox = document.getElementById('battle-box');
const dialogueText = document.getElementById('dialogue-text');
const choicesDiv = document.getElementById('choices');
const enemyDiv = document.getElementById('enemy');
const lvSpan = document.getElementById('lv');
const hpSpan = document.getElementById('hp');
const maxHpSpan = document.getElementById('max-hp');
const touchIndicator = document.getElementById('touch-indicator');

let player = { hp: 20, maxHp: 20, lv: 1, mercy: 0, act: 0 };
let state = 'intro';
let bullets = [];
let selectedChoice = 0;
let keys = {};
let touchActive = false;
let lastTouchPos = {x: 0, y: 0};
let gameInterval, bulletInterval;

const scenes = [
  {
    enemy: "Flowey",
    sprite: "🌻",
    intro: "* I'm Flowey! Flowey the flower!\n* You're new here, right?\n* In this world... KILL or BE KILLED!",
    choices: ["* Mercy", "* Befriend", "* Attack"],
    correct: 1,
    actSuccess: "* You smiled. Flowey got confused.",
    fightSuccess: "* You hit. Flowey laughed.",
    mercySuccess: "* Flowey ran away, screaming about friendship.",
    bulletPattern: () => createCircle(5, 2)
  },
  {
    enemy: "Toriel",
    sprite: "🐐",
    intro: "* I'm Toriel, guardian of the Ruins.\n* You must prove you're worthy.\n* But I don't want to hurt you...",
    choices: ["* Mercy", "* Talk", "* Attack"],
    correct: 0,
    actSuccess: "* You asked to learn magic. Toriel smiled.",
    fightSuccess: "* You hit. Toriel cried.",
    mercySuccess: "* Toriel hugged you and let you pass.",
    bulletPattern: () => createWave(3, 1.5)
  },
  {
    enemy: "Papyrus",
    sprite: "🦴",
    intro: "* NYEH HEH HEH!\n* HUMAN! PREPARE FOR MY PUZZLES!\n* BUT ALSO, LET'S BE FRIENDS!",
    choices: ["* Mercy", "* Compliment", "* Attack"],
    correct: 1,
    actSuccess: "* You complimented his scarf. Papyrus blushed.",
    fightSuccess: "* You attacked. Papyrus is disappointed.",
    mercySuccess: "* Papyrus invites you for spaghetti!",
    bulletPattern: () => createBones()
  },
  {
    enemy: "Undyne",
    sprite: "🔱",
    intro: "* NGAAAAH! HUMAN!\n* FACE MY SPEARS!\n* PREPARE TO FIGHT!",
    choices: ["* Mercy", "* Run", "* Attack"],
    correct: 1,
    actSuccess: "* You ran for water. Undyne is overheating.",
    fightSuccess: "* You attacked. Undyne gets stronger.",
    mercySuccess: "* You gave her water. Undyne befriends you.",
    bulletPattern: () => createWave(5, 2)
  },
  {
    enemy: "Sans",
    sprite: "💀",
    intro: "* hey, kid.\n* you've come a long way.\n* but... sometimes it's better to just... take a nap.",
    choices: ["* Take a nap", "* Joke", "* Attack"],
    correct: 0,
    actSuccess: "* You yawned. Sans nodded approvingly.",
    fightSuccess: "* You tried to hit. Sans disappeared.",
    mercySuccess: "* Sans winked and vanished in blue light.",
    bulletPattern: () => createBones()
  }
];

let currentScene = 0;

function startGame() {
  updateStats();
  showDialogue(scenes[0].intro, () => showChoices(scenes[0].choices));
}

function showDialogue(text, callback) {
  state = 'dialogue';
  clearBullets();
  typeText(text, callback);
}

function typeText(text, callback) {
  dialogueText.textContent = '';
  choicesDiv.innerHTML = '';
  let i = 0;
  const interval = setInterval(() => {
    if (i < text.length) {
      dialogueText.textContent += text[i++];
    } else {
      clearInterval(interval);
      if (callback) setTimeout(callback, 300);
    }
  }, 30);
}

function showChoices(choices) {
  state = 'choice';
  selectedChoice = 0;
  choicesDiv.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = (e) => {
      e.preventDefault();
      selectChoice(i);
    };
    btn.ontouchstart = (e) => {
      e.preventDefault();
      selectChoice(i);
    };
    choicesDiv.appendChild(btn);
  });
  updateChoiceSelection();
}

function updateChoiceSelection() {
  const btns = choicesDiv.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => b.classList.toggle('selected', i === selectedChoice));
}

function selectChoice(index) {
  if (state !== 'choice') return;
  state = 'processing';
  
  const scene = scenes[currentScene];
  if (index === scene.correct) {
    player.mercy += 20;
    if (scene.mercySuccess) {
      showDialogue(scene.mercySuccess, nextScene);
    } else {
      nextScene();
    }
  } else if (index === 1 && scene.actSuccess) {
    showDialogue(scene.actSuccess, () => startBulletHell());
  } else {
    takeDamage(4);
    showDialogue(scene.fightSuccess || "* That was... not very friendly.", () => startBulletHell());
  }
}

function nextScene() {
  currentScene++;
  if (currentScene >= scenes.length) {
    victory();
    return;
  }
  const scene = scenes[currentScene];
  enemyDiv.textContent = scene.sprite;
  showDialogue(scene.intro, () => showChoices(scene.choices));
}

function startBulletHell() {
  state = 'bullet';
  clearBullets();
  // Center heart
  heart.style.left = (battleBox.offsetWidth - 24) / 2 + 'px';
  heart.style.top = (battleBox.offsetHeight - 24) / 2 + 'px';
  
  const pattern = scenes[currentScene].bulletPattern;
  if (pattern) {
    setTimeout(pattern, 500);
  }
  bulletInterval = setInterval(updateBullets, 16);
}

function createCircle(count, speed) {
  const centerX = battleBox.offsetWidth / 2;
  const centerY = battleBox.offsetHeight / 2;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const bullet = document.createElement('div');
    bullet.className = 'bullet';
    bullet.style.width = bullet.style.height = '14px';
    bullet.style.left = centerX + 'px';
    bullet.style.top = centerY + 'px';
    battleBox.appendChild(bullet);
    bullets.push({
      el: bullet,
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    });
  }
}

function createWave(count, speed) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const bullet = document.createElement('div');
      bullet.className = 'bullet';
      bullet.style.width = '35px';
      bullet.style.height = '12px';
      bullet.style.left = '-35px';
      bullet.style.top = (battleBox.offsetHeight * (i + 1)) / (count + 1) + 'px';
      battleBox.appendChild(bullet);
      bullets.push({
        el: bullet,
        x: -35,
        y: parseFloat(bullet.style.top),
        vx: speed,
        vy: 0
      });
    }, i * 500);
  }
}

function createBones() {
  const bone = document.createElement('div');
  bone.className = 'bullet';
  bone.style.width = '90px';
  bone.style.height = '22px';
  bone.style.background = '#FFF';
  bone.style.borderRadius = '4px';
  bone.style.left = (battleBox.offsetWidth - 90) / 2 + 'px';
  bone.style.top = '-22px';
  battleBox.appendChild(bone);
  bullets.push({
    el: bone,
    x: parseFloat(bone.style.left),
    y: -22,
    vx: 0,
    vy: 3
  });
}

function updateBullets() {
  const heartRect = heart.getBoundingClientRect();
  const boxRect = battleBox.getBoundingClientRect();

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.el.style.left = b.x + 'px';
    b.el.style.top = b.y + 'px';

    const bRect = b.el.getBoundingClientRect();
    if (bRect.right < boxRect.left || bRect.left > boxRect.right ||
        bRect.bottom < boxRect.top || bRect.top > boxRect.bottom) {
      b.el.remove();
      bullets.splice(i, 1);
      continue;
    }

    if (checkCollision(heartRect, bRect)) {
      takeDamage(1);
      b.el.classList.add('flash');
      setTimeout(() => {
        if (b.el.parentNode) b.el.remove();
        bullets.splice(i, 1);
      }, 300);
    }
  }

  if (bullets.length === 0 && state === 'bullet') {
    clearInterval(bulletInterval);
    setTimeout(() => showChoices(scenes[currentScene].choices), 800);
  }
}

function checkCollision(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function takeDamage(amount) {
  player.hp -= amount;
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
  updateStats();
  battleBox.style.background = '#600';
  navigator.vibrate && navigator.vibrate(100);
  setTimeout(() => battleBox.style.background = '#000', 100);
}

function updateStats() {
  hpSpan.textContent = player.hp;
  maxHpSpan.textContent = player.maxHp;
  lvSpan.textContent = player.lv;
}

function gameOver() {
  state = 'gameover';
  clearBullets();
  clearInterval(bulletInterval);
  dialogueText.textContent = '';
  showDialogue("* You died.\n* But your determination hasn't faded...", () => {
    setTimeout(() => location.reload(), 2000);
  });
}

function victory() {
  state = 'victory';
  clearBullets();
  showDialogue("* You've passed all the trials...\n* Without killing anyone.\n* You are a true hero.", () => {
    dialogueText.innerHTML += "\n\n<span style='color:#FF0'>THE END</span>";
  });
}

function clearBullets() {
  bullets.forEach(b => b.el.remove());
  bullets = [];
  clearInterval(bulletInterval);
}

// Touch Controls - Direct positioning
battleBox.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (state !== 'bullet') return;
  touchActive = true;
  touchIndicator.style.display = 'block';
  moveHeartToTouch(e.touches[0]);
}, { passive: false });

battleBox.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touchActive && state === 'bullet') {
    moveHeartToTouch(e.touches[0]);
  }
}, { passive: false });

battleBox.addEventListener('touchend', (e) => {
  e.preventDefault();
  touchActive = false;
  touchIndicator.style.display = 'none';
}, { passive: false });

battleBox.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  touchActive = false;
  touchIndicator.style.display = 'none';
}, { passive: false });

function moveHeartToTouch(touch) {
  if (state !== 'bullet') return;
  const boxRect = battleBox.getBoundingClientRect();
  let x = touch.clientX - boxRect.left - 12; // half heart width
  let y = touch.clientY - boxRect.top - 12;
  
  // Keep heart within bounds
  x = Math.max(5, Math.min(boxRect.width - 29, x));
  y = Math.max(5, Math.min(boxRect.height - 29, y));
  
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
  
  // Show touch indicator
  touchIndicator.style.left = (x + 12) + 'px';
  touchIndicator.style.top = (y + 12) + 'px';
  
  lastTouchPos = {x, y};
}

// Keyboard Controls (for desktop testing)
document.addEventListener('keydown', e => {
  if (state === 'choice') {
    if (e.key === 'ArrowUp') { 
      selectedChoice = (selectedChoice - 1 + choicesDiv.children.length) % choicesDiv.children.length; 
      updateChoiceSelection(); 
    }
    if (e.key === 'ArrowDown') { 
      selectedChoice = (selectedChoice + 1) % choicesDiv.children.length; 
      updateChoiceSelection(); 
    }
    if (e.key === 'Enter' || e.key === ' ') selectChoice(selectedChoice);
  }
  keys[e.key] = true;
});

document.addEventListener('keyup', e => keys[e.key] = false);

// Keyboard Heart movement (desktop only)
function moveHeart() {
  if (state !== 'bullet' || touchActive) return;
  const speed = 4;
  let x = parseFloat(heart.style.left);
  let y = parseFloat(heart.style.top);
  const boxW = battleBox.offsetWidth;
  const boxH = battleBox.offsetHeight;

  if ((keys['ArrowLeft'] || keys['a']) && x > 5) x -= speed;
  if ((keys['ArrowRight'] || keys['d']) && x < boxW - 29) x += speed;
  if ((keys['ArrowUp'] || keys['w']) && y > 5) y -= speed;
  if ((keys['ArrowDown'] || keys['s']) && y < boxH - 29) y += speed;

  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
}

// Initialize heart
heart.style.left = (battleBox.offsetWidth - 24) / 2 + 'px';
heart.style.top = (battleBox.offsetHeight - 24) / 2 + 'px';

// Game loop
setInterval(moveHeart, 16);

// Prevent accidental page scrolling
document.body.addEventListener('touchmove', (e) => {
  e.preventDefault();
}, { passive: false });

// Start
startGame();
</script>
</body>
</html>
